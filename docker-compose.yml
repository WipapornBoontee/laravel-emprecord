services:
  app:
    image: dunglas/frankenphp:latest-php8.3-alpine
    container_name: laravel_emp_app
    restart: unless-stopped
    ports:
      - "8005:80"
    environment:
      SERVER_NAME: ":80"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-laravel_emp}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-wibo2909}
      PHP_INI_SCAN_DIR: ":/app/.docker-php"
    volumes:
      - .:/app
      - vendor_data:/app/vendor
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - laravel_emp_net

  mysql:
    image: mysql:8.0
    container_name: laravel_emp_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-wibo2909}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel_emp}
      MYSQL_USER: ${DB_USERNAME:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wibo2909}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel_emp_net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-wibo2909}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: laravel_emp_pma
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 300M
    depends_on:
      - mysql
    networks:
      - laravel_emp_net

  ngrok:
    image: ngrok/ngrok:latest
    container_name: laravel_emp_ngrok
    restart: unless-stopped
    ports:
      - "4040:4040"
    command:
      - "http"
      - "--url=hatchet-improving-creed.ngrok-free.dev"
      - "phpmyadmin:80"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    networks:
      - laravel_emp_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: laravel_emp_cf
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    networks:
      - laravel_emp_net

volumes:
  mysql_data:
    driver: local
  vendor_data:
    driver: local

networks:
  laravel_emp_net:
    driver: bridge
